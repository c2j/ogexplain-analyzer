[package]
name = "ogexplain-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ogexplain-tui"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
ratatui = "0.30"
crossterm = "0.29"
tui-tree-widget = "0.24"
ratatui-textarea = "0.8"
tokio = { version = "1", features = ["full"] }
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
