[package]
name = "ogexplain-cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ogexplain"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
ogsql-complexity = { path = "../ogsql-complexity" }
clap = { version = "4", features = ["derive", "cargo"] }
colored = "3"
anyhow = "1"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gaussdb = { git = "https://github.com/c2j/rust-opengauss", branch = "main", features = ["sync", "config", "tls-native-tls"], optional = true }
# Direct optional dep so we can toggle `openssl-sys/vendored` for static musl
# builds. Pulls the same version `native-tls` already resolves to.
openssl-sys = { version = "0.9", optional = true }
ogexplain-mcp = { path = "../ogexplain-mcp", optional = true }

[features]
default = ["db"]
db = ["dep:gaussdb"]
# Static-musl / hermetic-release helper: compiles OpenSSL from source so the
# resulting binary has no system libssl/libcrypto dependency. Use this in CI
# release builds; local dev keeps using system OpenSSL via plain `db`.
db-vendored = ["db", "openssl-sys/vendored"]
mcp = ["dep:ogexplain-mcp"]

[dev-dependencies]
tempfile = "3"
