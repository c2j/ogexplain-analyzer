[package]
name = "ogexplain-cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ogexplain"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
ogsql-complexity = { path = "../ogsql-complexity" }
clap = { version = "4", features = ["derive", "cargo"] }
colored = "3"
anyhow = "1"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gaussdb = { git = "https://github.com/c2j/rust-opengauss", branch = "main", features = ["sync"], optional = true }
native-tls = { version = "0.2", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
ogexplain-mcp = { path = "../ogexplain-mcp", optional = true }

[features]
default = ["db"]
db = ["dep:gaussdb", "dep:toml", "dep:dirs", "dep:keyring"]
db-tls = ["db", "gaussdb/tls-native-tls", "dep:native-tls"]
mcp = ["dep:ogexplain-mcp"]

[dev-dependencies]
tempfile = "3"
