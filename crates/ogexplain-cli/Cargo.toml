[package]
name = "ogexplain-cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ogexplain"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
ogsql-complexity = { path = "../ogsql-complexity" }
clap = { version = "4", features = ["derive", "cargo"] }
colored = "3"
anyhow = "1"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opengauss = { git = "https://github.com/c2j/rust-opengauss", branch = "master", optional = true }

[features]
default = ["db"]
db = ["dep:opengauss"]
