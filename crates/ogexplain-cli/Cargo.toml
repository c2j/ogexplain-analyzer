[package]
name = "ogexplain-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ogexplain"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
clap = { version = "4", features = ["derive"] }
colored = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
