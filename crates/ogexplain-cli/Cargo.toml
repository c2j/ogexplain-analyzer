[package]
name = "ogexplain-cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ogexplain"
path = "src/main.rs"

[dependencies]
ogexplain-core = { path = "../ogexplain-core" }
ogsql-complexity = { path = "../ogsql-complexity" }
clap = { version = "4", features = ["derive", "cargo"] }
colored = "3"
anyhow = "1"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gaussdb = { git = "https://github.com/c2j/rust-opengauss", branch = "main", features = ["sync", "config", "tls-native-tls"], optional = true }
ogexplain-mcp = { path = "../ogexplain-mcp", optional = true }

[features]
default = ["db"]
db = ["dep:gaussdb"]
mcp = ["dep:ogexplain-mcp"]

[dev-dependencies]
tempfile = "3"
