[package]
name = "ogexplain-core"
version.workspace = true
edition.workspace = true

[dependencies]
ogsql-parser = { git = "https://github.com/c2j/ogsql-parser" }
regex = "1"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
insta = { version = "1", features = ["yaml", "filters"] }
